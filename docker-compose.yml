services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - fiado_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fiado_data:
